<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Radial Glow Behind Assistant -->
  <circle cx="400" cy="240" r="160" fill="url(#cyan-glow)" opacity="0.15" filter="url(#blur-glow)" />

  <!-- Assistant Central Device / Interface Frame -->
  <rect x="220" y="110" width="360" height="260" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
  <rect x="220" y="110" width="360" height="42" rx="20" fill="#0f172a" />
  
  <!-- Window Controls -->
  <circle cx="246" cy="131" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="262" cy="131" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="278" cy="131" r="5" fill="#10b981" opacity="0.8" />
  
  <text x="310" y="135" fill="#64748b" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">ZYNOQ // AI CORE v2.4</text>

  <!-- Soundwave / Neural Frequency Visualizer -->
  <g transform="translate(250, 220)">
    <!-- Waveform bars -->
    <rect x="10" y="15" width="4" height="30" rx="2" fill="#38bdf8" />
    <rect x="22" y="5" width="4" height="50" rx="2" fill="#38bdf8" />
    <rect x="34" y="-10" width="4" height="80" rx="2" fill="#60a5fa" />
    <rect x="46" y="-25" width="4" height="110" rx="2" fill="#818cf8" />
    <rect x="58" y="-40" width="4" height="140" rx="2" fill="#a78bfa" />
    <rect x="70" y="-15" width="4" height="90" rx="2" fill="#c084fc" />
    <rect x="82" y="5" width="4" height="50" rx="2" fill="#818cf8" />
    <rect x="94" y="20" width="4" height="20" rx="2" fill="#60a5fa" />
    <rect x="106" y="10" width="4" height="40" rx="2" fill="#38bdf8" />
    <rect x="118" y="-5" width="4" height="70" rx="2" fill="#60a5fa" />
    <rect x="130" y="-30" width="4" height="120" rx="2" fill="#818cf8" />
    <rect x="142" y="-45" width="4" height="150" rx="2" fill="#c084fc" />
    <rect x="154" y="-20" width="4" height="100" rx="2" fill="#a78bfa" />
    <rect x="166" y="0" width="4" height="60" rx="2" fill="#818cf8" />
    <rect x="178" y="15" width="4" height="30" rx="2" fill="#60a5fa" />
    <rect x="190" y="-15" width="4" height="90" rx="2" fill="#38bdf8" />
    <rect x="202" y="-35" width="4" height="130" rx="2" fill="#818cf8" />
    <rect x="214" y="-10" width="4" height="80" rx="2" fill="#c084fc" />
    <rect x="226" y="10" width="4" height="40" rx="2" fill="#818cf8" />
    <rect x="238" y="20" width="4" height="20" rx="2" fill="#38bdf8" />
    <rect x="250" y="5" width="4" height="50" rx="2" fill="#38bdf8" />
    <rect x="262" y="15" width="4" height="30" rx="2" fill="#60a5fa" />
    <rect x="274" y="22" width="4" height="16" rx="2" fill="#38bdf8" />
    <rect x="286" y="25" width="4" height="10" rx="2" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Prompt Dialogue Box -->
  <rect x="245" y="305" width="310" height="42" rx="10" fill="#030712" stroke="#334155" stroke-width="1.5" />
  <circle cx="266" cy="326" r="6" fill="#10b981" />
  <text x="282" y="330" fill="#94a3b8" font-family="monospace" font-size="11">Listening for query or task...</text>
  <rect x="510" y="315" width="32" height="22" rx="6" fill="#2563eb" />
  <polygon points="522,321 532,326 522,331" fill="#ffffff" />

  <!-- Floating Tech Badges -->
  <g transform="translate(100, 190)">
    <rect x="0" y="0" width="95" height="32" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5" />
    <text x="47" y="20" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">LLM PIPELINE</text>
  </g>

  <g transform="translate(605, 230)">
    <rect x="0" y="0" width="95" height="32" rx="16" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
    <text x="47" y="20" fill="#bae6fd" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">FASTAPI / AI</text>
  </g>

  <g transform="translate(345, 410)">
    <rect x="0" y="0" width="110" height="30" rx="15" fill="#14532d" stroke="#16a34a" stroke-width="1.5" opacity="0.9" />
    <text x="55" y="19" fill="#bbf7d0" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">● MULTI-TURN AI</text>
  </g>
</svg>
